<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/perfil.png">
    <title>Cadastro - Pixel Hub</title>

<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="topo">
  <img src="img/user.png" class="logos-perfil">
</header>

<div class="quadrado">
     <center><img src="img/logo2.png" class="ph"></center>

    <center>
<form onsubmit="return validarCadastro()">
  <input class="entrar" type="text" placeholder="Nome de usuário" size="25" required> <br>
  <input class="entrar" type="email" placeholder="Digite seu e-mail" size="25" required> <br>

<div class="campo-senha">
  <input class="entrar" type="password" placeholder="Crie sua senha" id="senha" size="25" maxlength="10" required>
  <img src="img/visualizar.png" class="ativar-senha" onclick="mostrarSenha()">
</div>
<br>
 <div class="botoes">
  <button type="button" class="button-cadastro" onclick="window.location.href='index.html'">VOLTAR</button>
  <button type="submit">CADASTRAR-SE</button>
</div>

</form>
    </center>
</div>

<script>
  function mostrarSenha() {
    const input = document.getElementById('senha');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function validarCadastro() {
  window.location.href = 'index.html';
  return false;
  }
</script>
</body>
</html>
