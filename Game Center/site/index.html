<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center</title>

<link rel="stylesheet" href="index.css">

</head>
<body>
<center>
    <div class="quadrado">
        <center><h1>game center</h1></center>
 
        <center>
      <input class="entrar" type="text" placeholder="Digite seu usuário"  size="25"> <br>
      <input class="entrar" type="password" placeholder="Digite sua senha" id="senha" size="25" maxlength="10" required>
     
    <div class="olho">
      <img src="img/visualizar.png" class="ativar-senha" onclick="mostrarSenha()"> 
    </div>
      
      <button>LOGIN</button>
      <button>CADASTRO</button>

      
        </center>
    </div>
</center>

<script>
  function mostrarSenha() {
    const input = document.getElementById('senha');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
