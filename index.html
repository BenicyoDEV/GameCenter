<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>testes</title>
  <style>
    /* Caixa externa da lista */
    ul.lista-coluna {
      list-style: none;
      padding: 0;
      margin: 0;
      font-family: sans-serif;
      border: 1px solid #ccc;
      max-width: 300px;
      margin-bottom: 15px;
    }

    /* Cada linha da lista */
    ul.lista-coluna li {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      color: #333;
    }

    ul.lista-coluna li:last-child {
      border-bottom: none;
    }

    ul.lista-coluna li.topo {
      background-color: #f0f0f0;
      font-weight: bold;
      color: #000;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Gerenciar Jogadores</h2>

  <form id="formulario">
    <input type="text" id="nomeJogador" placeholder="20Comer70Correr" required>
    <button type="submit">Cadastrar</button>
  </form>
  <br><br>

  <ul id="lista" class="lista-coluna">
    <li class="topo">Gerenciar Jogadores</li>
  </ul>

  <br><br>
  <h2>Menu Principal</h2>
  <button id="primeiroCriarTorneio" onclick="CriarTorneio()">Criar Torneio</button>

  <br><br>
  <ul id="selecionarJogador" class="lista-coluna"></ul>
  <br>
  <ul id="jogadoresSelecionados" class="lista-coluna"></ul>
  <div id="opcoes"></div>
  <br><br>

  <h2 id="titulo"></h2>
  <br>
  <div id="rodada" class="rodadaClass"></div>

<script>
const formulario = document.getElementById('formulario');
const lista = document.getElementById('lista');
const rodada = document.getElementById('rodada');

let jogadoresPorRodada;
let jogselecionados = [];
let nomes = [];
let numeroRodada = 1;

formulario.addEventListener('submit', function(event) {
    event.preventDefault();
    const nomeJogador = document.getElementById('nomeJogador').value.trim();
    if(nomeJogador) {
        nomes.push(nomeJogador);
        CarregarTabela();
        formulario.reset();
    }
});

function CriarTorneio() {
    const listaSelecionar = document.getElementById('selecionarJogador');
    const opcoes = document.getElementById('opcoes');

    listaSelecionar.innerHTML = '<li class="topo">Selecione os Jogadores</li>';
    
    for (let i = 0; i < nomes.length; i++) {
        let esseNome = nomes[i];
        let novoItem = document.createElement("button");
        novoItem.type = "button";
        novoItem.textContent = esseNome;

        novoItem.addEventListener('click', function() {
            jogselecionados.push(esseNome);
            CarregarJogadoresSelecionados();
            this.disabled = true; // CORRIGIDO: Usa 'this' para desativar corretamente
        });

        let li = document.createElement("li");
        li.appendChild(novoItem);
        listaSelecionar.appendChild(li);
    }

    opcoes.innerHTML = `
      <form id="confirmarOpcoes">
        <p>quantos jogadores por rodada?</p>
        <input id="jogrod" type="number" placeholder="2" value="2" required>
        <br>
        <p>qual o nome do torneio?</p>
        <input id="nomtor" type="text" placeholder="torneio legal" required>
        <br><br>
        <button type="submit">Confirmar e Iniciar</button>
      </form>`;

    const confirmform = document.getElementById('confirmarOpcoes');
    confirmform.addEventListener('submit', function(event) {
        event.preventDefault();

        const nomeTorneio = document.getElementById('titulo');
        const nomeAtribuido = document.getElementById('nomtor').value;
        nomeTorneio.textContent = nomeAtribuido;

        const jogrod = document.getElementById('jogrod').value;
        jogadoresPorRodada = Number(jogrod);

        // Limpa a área para começar o torneio de fato
        rodada.innerHTML = '';
        Torneio();
    });
}

function CarregarJogadoresSelecionados() {
    const listaSelecionados = document.getElementById('jogadoresSelecionados');
    listaSelecionados.innerHTML = '<li class="topo">Jogadores Selecionados</li>';

    for (let i = 0; i < jogselecionados.length; i++) {
        let esseNomeSelecionado = jogselecionados[i];
        let novoItem = document.createElement("li");
        novoItem.textContent = esseNomeSelecionado;
        listaSelecionados.appendChild(novoItem);
    }
}

function Torneio() {
    // CORRIGIDO: Se sobrou apenas 1 jogador no array principal, ele é o campeão!
    if (jogselecionados.length === 1) {
        rodada.innerHTML = `<br><h2>🏆 VENCEDOR DO TORNEIO: ${jogselecionados[0]} 🏆</h2><br>`;
        return;
    }

    // Se o usuário clicar em "Próximo" sem selecionar ninguém, evita que o código quebre
    if (jogselecionados.length === 0) {
        alert("Por favor, selecione os vencedores da rodada atual antes de avançar!");
        return;
    }

    // Limpa a tela da rodada anterior para mostrar a nova fase
    rodada.innerHTML = '';

    // Passa os vencedores anteriores para a lista de disputa atual e reseta a lista de novos vencedores
    let jogsAtual = jogselecionados;
    jogselecionados = [];

    let listaRodada = null;

    for (let i = 0; i < jogsAtual.length; i++) {
        // Cria um novo grupo/lista a cada X jogadores
        if (i % jogadoresPorRodada === 0) {
            listaRodada = document.createElement('ul');
            listaRodada.className = "lista-coluna";
            listaRodada.innerHTML = `<li class="topo">Grupo ${numeroRodada} - Selecione o vencedor</li>`;

            rodada.appendChild(listaRodada);
            numeroRodada++;
        }

        let novoItem = document.createElement("button");
        novoItem.type = "button";
        novoItem.textContent = jogsAtual[i];

        novoItem.addEventListener('click', function() {
            if (!this.disabled) {
                this.disabled = true;
                this.style.backgroundColor = "#d3f2d3"; // Muda para verde claro para dar feedback visual
                jogselecionados.push(jogsAtual[i]); // Salva esse jogador como vencedor para a próxima fase
                console.log("Vencedores avançando:", jogselecionados);
            }
        });

        let li = document.createElement("li");
        li.appendChild(novoItem);
        listaRodada.appendChild(li);
    }

    // Adiciona o botão "Avançar Próxima Rodada" no final da página
    rodada.appendChild(document.createElement('br'));
    const proximaRodada = document.createElement("button");
    proximaRodada.type = "button";
    proximaRodada.textContent = "Avançar de Fase ➔";
    proximaRodada.style.padding = "10px 20px";
    proximaRodada.style.fontWeight = "bold";
    
    proximaRodada.addEventListener('click', function() {
        Torneio(); // Chama a si mesma para rodar o próximo filtro de jogadores
    });

    rodada.appendChild(proximaRodada);
}

function CarregarTabela() {
    lista.innerHTML = '<li class="topo">Jogadores</li>';
    for (let i = 0; i < nomes.length; i++) {
        let esseNome = nomes[i];
        let novoItem = document.createElement("li");
        novoItem.textContent = esseNome;
        lista.appendChild(novoItem); 
    }
}
</script>
</body>
</html>
